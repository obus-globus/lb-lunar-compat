# Builds the mod and checks the jar carries what it has to: the companion types LiquidBounce
# reads, and no okhttp of its own.
name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew jar --no-daemon

      - name: Check the jar
        shell: bash
        run: |
          jar=build/libs/lb-lunar-compat.jar
          [ -f "$jar" ] || { echo "no jar was built"; exit 1; }

          # The companion types have to carry the exact names kotlin compiles to, or the reads
          # this mod redirects would not resolve.
          for want in 'okhttp3/Headers$Companion.class' \
                      'okhttp3/HttpUrl$Companion.class' \
                      'okhttp3/MediaType$Companion.class' \
                      'okhttp3/RequestBody$Companion.class' \
                      'okhttp3/MultipartBody$Part$Companion.class'; do
            unzip -l "$jar" | grep -qF "$want" || { echo "missing $want"; exit 1; }
          done

          # Shipping an okhttp class of its own would shadow the host's and defeat the point.
          # The mixin sits in that package too, because a companion type can only be named from
          # inside it, so it is not a shadow.
          # Subpackages and inner classes count too, so match the whole namespace and allow
          # only the companions and the mixin that has to sit beside them.
          shipped=$(unzip -l "$jar" | awk '$4 ~ /^(okhttp3|okio)\// && $4 ~ /\.class$/ {print $4}' \
            | grep -vE '^okhttp3/(Headers|HttpUrl|MediaType|RequestBody|MultipartBody\$Part)\$Companion\.class$' \
            | grep -vE '^okhttp3/MixinLiquidBounceCompanions\.class$' || true)
          [ -z "$shipped" ] || { echo "would shadow the host's okhttp: $shipped"; exit 1; }

          for cls in lbcompat/mixin/MixinAuthlibHttpUtils.class \
                     lbcompat/mixin/MixinAuthlibRequestBody.class; do
            unzip -l "$jar" | grep -qF "$cls" || { echo "missing $cls"; exit 1; }
          done

          for cfg in fabric.mod.json lbcompat.mixins.json lbcompat-okhttp.mixins.json; do
            unzip -l "$jar" | grep -qF "$cfg" || { echo "missing $cfg"; exit 1; }
          done
          echo "jar looks right:"
          unzip -l "$jar" | awk '$4 ~ /\.(class|json)$/ {print "  " $4}'

      - uses: actions/upload-artifact@v4
        with:
          name: lb-lunar-compat
          path: build/libs/lb-lunar-compat.jar
          if-no-files-found: error

      - name: Say so in Discord
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        shell: bash
        run: |
          [ -n "$WEBHOOK" ] || { echo "no webhook configured, nothing to send"; exit 0; }
          python3 - <<'PY' | curl -fsS -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK" > /dev/null
          import json, os
          print(json.dumps({"content":
              f"**{os.environ['GITHUB_WORKFLOW']}** failed on "
              f"{os.environ['GITHUB_REPOSITORY']}\n"
              f"<https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}>"}))
          PY
