# Builds the mod and checks the jar carries what it has to: the companion types LiquidBounce
# reads, and no okhttp of its own.
name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew jar --no-daemon

      - name: Check the jar
        shell: bash
        run: |
          jar=$(ls build/libs/lb-lunar-compat-*.jar 2>/dev/null | head -1)
          [ -n "$jar" ] && [ -f "$jar" ] || { echo "no jar was built"; exit 1; }
          echo "checking $jar"

          # The companion types have to carry the exact names kotlin compiles to, or the reads
          # this mod redirects would not resolve.
          for want in 'okhttp3/HttpUrl$Companion.class' \
                      'okhttp3/MediaType$Companion.class' \
                      'okhttp3/RequestBody$Companion.class' \
                      'okhttp3/MultipartBody$Part$Companion.class'; do
            unzip -l "$jar" | grep -qF "$want" || { echo "missing $want"; exit 1; }
          done

          # Shipping any other okhttp class would shadow the host's and defeat the point.
          # Subpackages and inner classes count too, so match the whole namespace.
          shipped=$(unzip -l "$jar" | awk '$4 ~ /^(okhttp3|okio)\// && $4 ~ /\.class$/ {print $4}' \
            | grep -vE '^okhttp3/(HttpUrl|MediaType|RequestBody|MultipartBody\$Part)\$Companion\.class$' \
            || true)
          [ -z "$shipped" ] || { echo "would shadow the host's okhttp: $shipped"; exit 1; }

          for cfg in fabric.mod.json lbcompat.mixins.json; do
            unzip -l "$jar" | grep -qF "$cfg" || { echo "missing $cfg"; exit 1; }
          done

          # Read the mixins out of the config rather than naming them here, so that moving or
          # adding one cannot leave this step asserting a layout the mod has left behind.
          unzip -p "$jar" lbcompat.mixins.json > mixins.json
          pkg=$(python3 -c 'import json; print(json.load(open("mixins.json"))["package"])')
          # Mixin refuses to load anything in a package it has been handed a config for, so a
          # mixin under okhttp3 would take the host's okhttp down with it.
          case "$pkg" in
            okhttp3|okhttp3.*|okio|okio.*) echo "mixin package $pkg would break the host"; exit 1 ;;
          esac
          python3 -c 'import json; d = json.load(open("mixins.json")); print("\n".join(d.get("mixins", []) + d.get("client", [])))' \
            | while read -r m; do
                [ -n "$m" ] || continue
                want="${pkg//.//}/${m//.//}.class"
                unzip -l "$jar" | grep -qF "$want" \
                  || { echo "config names $m but the jar has no $want"; exit 1; }
              done
          echo "jar looks right:"
          unzip -l "$jar" | awk '$4 ~ /\.(class|json)$/ {print "  " $4}'

      - name: Put what the jar carries on the run page
        if: always()
        shell: bash
        run: |
          jar=$(ls build/libs/lb-lunar-compat-*.jar 2>/dev/null | head -1)
          {
            echo "## The jar"
            echo
            if [ -n "$jar" ]; then
              echo '```'
              unzip -p "$jar" META-INF/MANIFEST.MF | grep -E '^(Implementation|Tested)-' | tr -d '\r'
              echo
              unzip -l "$jar" | awk '$4 ~ /\.(class|json)$/ {print $4}'
              echo '```'
            else
              echo "No jar was built."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: lb-lunar-compat
          path: build/libs/lb-lunar-compat-*.jar
          if-no-files-found: error

      - name: Say so in Discord
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        shell: bash
        run: |
          [ -n "$WEBHOOK" ] || { echo "no webhook configured, nothing to send"; exit 0; }
          python3 - <<'PY' | curl -fsS -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK" > /dev/null
          import json, os
          print(json.dumps({"content":
              f"**{os.environ['GITHUB_WORKFLOW']}** failed on "
              f"{os.environ['GITHUB_REPOSITORY']}\n"
              f"<https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}>"}))
          PY
