# What a stock LiquidBounce calls that the okhttp Lunar bundles does not declare, with nothing
# of this mod taken into account. It is the reason this mod exists, so it is expected to fail:
# a red run is the standing list of what would throw on Lunar unaided, not a regression.
#
# The sibling okhttp-compat workflow answers the other question, whether the mod still covers
# that list. Watch that one for regressions; read this one for the list itself.
name: okhttp compatibility, unaided

on:
  workflow_dispatch:
    inputs:
      mc_version:
        description: 'Minecraft version'
        required: false
        default: '26.2'
  schedule:
    - cron: '30 7 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check out LiquidBounce
        uses: actions/checkout@v5
        with:
          repository: CCBlueX/LiquidBounce
          ref: nextgen
          path: liquidbounce
          submodules: recursive

      - name: Build LiquidBounce
        id: lbbuild
        run: ./tools/build-liquidbounce.sh liquidbounce

      - name: Fetch the okhttp Lunar bundles
        env:
          MC_VERSION: ${{ inputs.mc_version || '26.2' }}
        run: ./tools/fetch-lunar-okhttp.sh "$MC_VERSION" lunar-okhttp.jar

      # Run without --covered, so nothing is subtracted and every member that would not resolve
      # is listed. Failing is the normal outcome, which is exactly why the outcome is recorded: a
      # run that failed for some other reason would otherwise look the same as the expected one.
      - name: Resolve a stock LiquidBounce against it
        id: unaided
        shell: bash
        run: |
          jar=$(ls -t liquidbounce/build/libs/liquidbounce-*.jar | grep -v sources | head -1)
          [ -n "$jar" ] || { echo "no LiquidBounce jar was built"; exit 2; }
          set +e
          python3 tools/check_okhttp_compat.py --client "$jar" --host lunar-okhttp.jar | tee report.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Put the report on the run page
        if: always()
        shell: bash
        env:
          LB_BUILD_FAILED: ${{ steps.lbbuild.outputs.failed }}
          RC: ${{ steps.unaided.outputs.rc }}
        run: |
          {
            echo "## A stock LiquidBounce against the okhttp Lunar bundles"
            echo
            if [ "$LB_BUILD_FAILED" = "true" ]; then
              echo "LiquidBounce did not build, so nothing was checked."
            elif [ "$RC" = "1" ]; then
              echo "Every member below would fail to resolve on Lunar. That is the expected result."
            elif [ "$RC" = "0" ]; then
              echo "Nothing failed to resolve, so Lunar and LiquidBounce now agree on okhttp."
            else
              echo "The check could not run."
            fi
            echo
            if [ -s report.txt ]; then
              echo '```'
              cat report.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okhttp-unaided-report
          path: report.txt
          if-no-files-found: warn
