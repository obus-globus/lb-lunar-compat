# Checks whether a current LiquidBounce still only calls okhttp members that the okhttp Lunar
# bundles declares. Everything it does not is what this mod has to cover, so a member appearing
# outside covered-members.txt means LiquidBounce started calling something new and this mod needs
# a matching redirect.
#
# Nothing is pinned by hand: LiquidBounce is built from nextgen and the okhttp comes from whatever
# Lunar serves today, so a Lunar update or a LiquidBounce change shows up on the next run.
name: okhttp compatibility

on:
  workflow_dispatch:
    inputs:
      mc_version:
        description: 'Minecraft version'
        required: false
        default: '26.2'
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Check out LiquidBounce
        uses: actions/checkout@v5
        with:
          repository: CCBlueX/LiquidBounce
          ref: nextgen
          path: liquidbounce
          submodules: recursive

      - name: Build LiquidBounce
        working-directory: liquidbounce
        run: ./gradlew jar --no-daemon

      - name: Fetch the okhttp Lunar bundles
        id: lunar
        run: ./tools/fetch-lunar-okhttp.sh "${{ inputs.mc_version || '26.2' }}" lunar-okhttp.jar

      - name: Resolve LiquidBounce's okhttp calls against it
        shell: bash
        run: |
          jar=$(ls -t liquidbounce/build/libs/liquidbounce-*.jar | grep -v sources | head -1)
          [ -n "$jar" ] || { echo "no LiquidBounce jar was built"; exit 2; }
          # The nested libraries carry a good part of the surface, so a jar without them would
          # pass while saying nothing about authlib.
          unzip -l "$jar" | grep -q 'META-INF/jars/mc-authlib' \
            || { echo "$jar has no nested libraries, nothing to check"; exit 2; }
          echo "checking $jar"
          python3 tools/check_okhttp_compat.py \
            --client "$jar" \
            --host lunar-okhttp.jar \
            --covered covered-members.txt | tee report.txt

      - name: Check the mixin targets still exist
        shell: bash
        run: |
          jar=$(ls -t liquidbounce/build/libs/liquidbounce-*.jar | grep -v sources | head -1)
          python3 tools/check_mixin_targets.py --client "$jar" \
            src/main/java/okhttp3/MixinLiquidBounceCompanions.java \
            src/main/java/lbcompat/mixin/*.java | tee -a report.txt

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okhttp-compat-report
          path: report.txt
          if-no-files-found: warn
