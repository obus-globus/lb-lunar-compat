# Checks whether a current LiquidBounce still only calls okhttp members that the okhttp Lunar
# bundles declares. Everything it does not is what this mod has to cover, so a member appearing
# outside covered-members.txt means LiquidBounce started calling something new and this mod needs
# a matching redirect.
#
# Nothing is pinned by hand: LiquidBounce is built from nextgen and the okhttp comes from whatever
# Lunar serves today, so a Lunar update or a LiquidBounce change shows up on the next run.
name: okhttp compatibility

on:
  workflow_dispatch:
    inputs:
      mc_version:
        description: 'Minecraft version'
        required: false
        default: '26.2'
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint the checks
        run: uv run ruff check tools/

      - name: Check out LiquidBounce
        uses: actions/checkout@v5
        with:
          repository: CCBlueX/LiquidBounce
          ref: nextgen
          path: liquidbounce
          submodules: recursive

      - name: Build LiquidBounce
        id: lbbuild
        run: ./tools/build-liquidbounce.sh liquidbounce

      - name: Fetch the okhttp Lunar bundles
        id: lunar
        env:
          MC_VERSION: ${{ inputs.mc_version || '26.2' }}
        run: ./tools/fetch-lunar-okhttp.sh "$MC_VERSION" lunar-okhttp.jar lunar.meta

      - name: Resolve LiquidBounce's okhttp calls against it
        shell: bash
        env:
          MC_VERSION: ${{ inputs.mc_version || '26.2' }}
        run: |
          jar=$(ls -t liquidbounce/build/libs/liquidbounce-*.jar | grep -v sources | head -1)
          [ -n "$jar" ] || { echo "no LiquidBounce jar was built"; exit 2; }
          # The nested libraries carry a good part of the surface, so a jar built without them
          # would pass while having read almost nothing.
          nested=$(unzip -l "$jar" | grep -c 'META-INF/jars/.*\.jar' || true)
          [ "$nested" -gt 0 ] || { echo "$jar has no nested libraries, nothing to check"; exit 2; }
          echo "$jar carries $nested nested library jar(s)"
          echo "checking $jar"
          python3 tools/check_okhttp_compat.py \
            --client "$jar" \
            --host lunar-okhttp.jar \
            --covered covered-members.txt | tee report.txt

      - name: Check the mixin targets still exist
        shell: bash
        env:
          MC_VERSION: ${{ inputs.mc_version || '26.2' }}
        run: |
          jar=$(ls -t liquidbounce/build/libs/liquidbounce-*.jar | grep -v sources | head -1)
          # Globbed rather than listed, so moving or adding a mixin cannot leave this checking
          # a layout the mod has left behind.
          configs=()
          for cfg in src/main/resources/*.mixins.json; do configs+=(--config "$cfg"); done
          [ ${#configs[@]} -gt 0 ] || { echo "no mixin config found"; exit 2; }
          sources=(src/main/java/lbcompat/mixin/*.java)
          [ -e "${sources[0]}" ] || { echo "no mixin sources found"; exit 2; }
          python3 tools/check_mixin_targets.py --client "$jar" --covered covered-members.txt \
            "${configs[@]}" "${sources[@]}" | tee -a report.txt

      - name: Put the report on the run page
        if: always()
        shell: bash
        env:
          LB_BUILD_FAILED: ${{ steps.lbbuild.outputs.failed }}
        run: |
          {
            echo "## LiquidBounce against the okhttp Lunar bundles"
            echo
            echo '```'
            jar=$(ls -t liquidbounce/build/libs/liquidbounce-*.jar 2>/dev/null | grep -v sources | head -1)
            ./tools/describe-inputs.sh "$jar" lunar.meta liquidbounce || echo "inputs unknown"
            echo '```'
            echo
            if [ "$LB_BUILD_FAILED" = "true" ]; then
              echo "LiquidBounce did not build after 3 attempts, so nothing was checked."
              echo "This says nothing about compatibility either way."
            elif [ -s report.txt ]; then
              echo '```'
              cat report.txt
              echo '```'
            else
              echo "The checks produced no report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okhttp-compat-report
          path: report.txt
          if-no-files-found: warn

      - name: Say so in Discord
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          LB_BUILD_FAILED: ${{ steps.lbbuild.outputs.failed }}
        shell: bash
        run: |
          [ -n "$WEBHOOK" ] || { echo "no webhook configured, nothing to send"; exit 0; }
          python3 - <<'PY' | curl -fsS -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK" > /dev/null
          import json, os
          # A build that never produced a jar says nothing about compatibility, so it should not
          # read like a call site moved.
          if os.environ.get("LB_BUILD_FAILED") == "true":
              what = "could not build LiquidBounce, so nothing was checked"
          else:
              what = "found something that no longer resolves against Lunar's okhttp"
          print(json.dumps({"content":
              f"**{os.environ['GITHUB_WORKFLOW']}** {what}\n"
              f"<https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}>"}))
          PY
