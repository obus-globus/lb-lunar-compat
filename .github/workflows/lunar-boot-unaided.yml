# Boots Lunar with a current LiquidBounce and nothing else, to show the breakage this mod
# exists for is still there.
#
# This is the control for the run with the mod: if LiquidBounce stops failing here, either
# LiquidBounce or Lunar has changed and the mod may no longer be needed, which is worth
# finding out before the other job's pass is read as meaning anything.
name: lunar boot, without the mod

on:
  workflow_dispatch:
    inputs:
      mc_version:
        description: 'Minecraft version'
        required: false
        default: '26.2'
  schedule:
    - cron: '15 7 * * *'

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install a display for the headless run
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Check out LiquidBounce
        uses: actions/checkout@v5
        with:
          repository: CCBlueX/LiquidBounce
          ref: nextgen
          path: liquidbounce
          submodules: recursive

      - name: Build LiquidBounce
        working-directory: liquidbounce
        run: ./gradlew jar --no-daemon

      - name: Boot Lunar with LiquidBounce alone
        shell: bash
        env:
          MC_VERSION: ${{ inputs.mc_version || '26.2' }}
        run: |
          jar=$(ls -t liquidbounce/build/libs/liquidbounce-*.jar | grep -v sources | head -1)
          [ -n "$jar" ] || { echo "no LiquidBounce jar was built"; exit 2; }
          set +e
          ./tools/boot-lunar.sh "${MC_VERSION}" "$jar"
          code=$?
          set -e
          case $code in
            1) echo "LiquidBounce still breaks on Lunar unaided, as expected." ;;
            0) echo "::warning::LiquidBounce no longer breaks on Lunar unaided; this mod may be unnecessary."
               exit 1 ;;
            *) echo "the run did not produce a verdict (exit $code)"; exit $code ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lunar-boot-unaided-report
          path: lunar-runtime-compat.txt
          if-no-files-found: warn
