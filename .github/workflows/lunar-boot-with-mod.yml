# Boots Lunar with a current LiquidBounce and this mod, and reads the init log.
#
# The static check cannot see whether a redirect binds: an injector Ichor rejects, or one whose
# target moved, only shows up when mixins are applied. Both have happened, so this runs the real
# thing. Read alongside the run without the mod, which shows the crash is still there to fix.
#
# No account is needed. Lunar's own overlay dies without a GPU shortly after init, so a pass
# means LiquidBounce started and no mixin or linkage failure appeared, not a clean session.
name: lunar boot, with the mod

on:
  workflow_dispatch:
    inputs:
      mc_version:
        description: 'Minecraft version'
        required: false
        default: '26.2'
  schedule:
    - cron: '30 7 * * *'

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install a display for the headless run
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Build the mod
        run: ./gradlew jar --no-daemon

      - name: Check out LiquidBounce
        uses: actions/checkout@v5
        with:
          repository: CCBlueX/LiquidBounce
          ref: nextgen
          path: liquidbounce
          submodules: recursive

      - name: Build LiquidBounce
        working-directory: liquidbounce
        run: ./gradlew jar --no-daemon

      - name: Boot Lunar with both
        shell: bash
        env:
          MC_VERSION: ${{ inputs.mc_version || '26.2' }}
        run: |
          jar=$(ls -t liquidbounce/build/libs/liquidbounce-*.jar | grep -v sources | head -1)
          [ -n "$jar" ] || { echo "no LiquidBounce jar was built"; exit 2; }
          ./tools/boot-lunar.sh "${MC_VERSION}" "$jar" build/libs/lb-lunar-compat.jar

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lunar-boot-report
          path: lunar-runtime-compat.txt
          if-no-files-found: warn

      - name: Say so in Discord
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        shell: bash
        run: |
          [ -n "$WEBHOOK" ] || { echo "no webhook configured, nothing to send"; exit 0; }
          python3 - <<'PY' | curl -fsS -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK" > /dev/null
          import json, os
          print(json.dumps({"content":
              f"**{os.environ['GITHUB_WORKFLOW']}** failed on "
              f"{os.environ['GITHUB_REPOSITORY']}\n"
              f"<https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}>"}))
          PY
