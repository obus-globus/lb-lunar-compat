# Boots Lunar with a current LiquidBounce and this mod, and reads the init log.
#
# The static check cannot see whether a redirect binds: an injector Ichor rejects, or one whose
# target moved, only shows up when mixins are applied. Both have happened, so this runs the real
# thing. What it does not show is that the redirects fire: the reads they cover sit behind the
# theme, which needs a GL context a runner does not have, so a run gets nowhere near them. Read
# it as "the mixins apply and nothing blows up at load", and leave the rest to the static check.
#
# No account is needed. Lunar's own overlay dies without a GPU shortly after init, so a pass
# means LiquidBounce started and no mixin or linkage failure appeared, not a clean session.
name: lunar boot, with the mod

on:
  workflow_dispatch:
    inputs:
      mc_version:
        description: 'Minecraft version'
        required: false
        default: '26.2'
  schedule:
    - cron: '30 7 * * *'

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install a display for the headless run
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Build the mod
        run: ./gradlew jar --no-daemon

      - name: Check out LiquidBounce
        uses: actions/checkout@v5
        with:
          repository: CCBlueX/LiquidBounce
          ref: nextgen
          path: liquidbounce
          submodules: recursive

      - name: Build LiquidBounce
        id: lbbuild
        run: ./tools/build-liquidbounce.sh liquidbounce

      - name: Boot Lunar with both
        shell: bash
        env:
          MC_VERSION: ${{ inputs.mc_version || '26.2' }}
        run: |
          jar=$(ls -t liquidbounce/build/libs/liquidbounce-*.jar | grep -v sources | head -1)
          [ -n "$jar" ] || { echo "no LiquidBounce jar was built"; exit 2; }
          mod=$(ls build/libs/lb-lunar-compat-*.jar 2>/dev/null | head -1)
          [ -n "$mod" ] || { echo "the mod was not built"; exit 2; }
          ./tools/boot-lunar.sh "${MC_VERSION}" "$jar" "$mod"


      - name: Put the report on the run page
        if: always()
        shell: bash
        env:
          LB_BUILD_FAILED: ${{ steps.lbbuild.outputs.failed }}
        run: |
          {
            echo "## Lunar runtime"
            echo
            echo '```'
            jar=$(ls -t liquidbounce/build/libs/liquidbounce-*.jar 2>/dev/null | grep -v sources | head -1)
            ./tools/describe-inputs.sh "$jar" "" liquidbounce || echo "inputs unknown"
            echo '```'
            echo
            if [ "$LB_BUILD_FAILED" = "true" ]; then
              echo "LiquidBounce did not build, so Lunar was never booted."
              echo "This says nothing about compatibility either way."
            elif [ -s lunar-runtime-compat.txt ]; then
              echo '```'
              cat lunar-runtime-compat.txt
              echo '```'
            else
              echo "The run produced no report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lunar-boot-report
          path: lunar-runtime-compat.txt
          if-no-files-found: warn

      - name: Say so in Discord
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          LB_BUILD_FAILED: ${{ steps.lbbuild.outputs.failed }}
        shell: bash
        run: |
          [ -n "$WEBHOOK" ] || { echo "no webhook configured, nothing to send"; exit 0; }
          python3 - <<'PY' | curl -fsS -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK" > /dev/null
          import json, os
          # A run that never booted says nothing about compatibility, so it should not read like
          # the mod broke on Lunar.
          if os.environ.get("LB_BUILD_FAILED") == "true":
              what = "could not build LiquidBounce, so Lunar was never booted"
          else:
              what = "booted Lunar and hit a failure"
          print(json.dumps({"content":
              f"**{os.environ['GITHUB_WORKFLOW']}** {what}\n"
              f"<https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}>"}))
          PY
